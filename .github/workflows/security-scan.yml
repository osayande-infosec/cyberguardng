# CyberGuardNG - Security Pipeline
# Runs on push to main, pull requests, and manual trigger only
# NO scheduled/cron scans to avoid recurring billing

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # Job 1: Dependency Vulnerability Scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cyberguardng/react-site/package-lock.json

      - name: Install dependencies
        working-directory: cyberguardng/react-site
        run: npm ci

      - name: Run npm audit
        working-directory: cyberguardng/react-site
        run: |
          echo "=== npm audit results ==="
          npm audit --audit-level=moderate 2>&1 || true
          echo ""
          echo "=== Outdated packages ==="
          npm outdated 2>&1 || true

  # Job 2: CodeQL Static Analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # Job 3: OWASP ZAP Dynamic Scan (only on PRs and manual trigger)
  owasp-zap-scan:
    name: OWASP ZAP Baseline Scan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://cyberguardng.ca'
          cmd_options: '-a -I'
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.run_number }}
          path: report_html.html
          retention-days: 30

  # Job 4: Security Headers Check
  security-headers:
    name: Security Headers Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check Security Headers
        run: |
          echo "=== Security Headers Check for cyberguardng.ca ==="
          HEADERS=$(curl -sI https://cyberguardng.ca)
          echo "$HEADERS" | grep -iE "(strict-transport|content-security|x-frame|x-content-type|referrer-policy|permissions-policy)" || echo "WARNING: Some security headers missing"
          echo ""
          echo "Check full report: https://securityheaders.com/?q=cyberguardng.ca"

  # Job 5: SSL/TLS Configuration Check
  ssl-check:
    name: SSL/TLS Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify SSL Certificate
        run: |
          echo "=== SSL/TLS Configuration ==="
          CERT_INFO=$(echo | openssl s_client -servername cyberguardng.ca -connect cyberguardng.ca:443 2>/dev/null)
          echo "$CERT_INFO" | openssl x509 -noout -dates
          echo "$CERT_INFO" | openssl x509 -noout -subject -issuer
          echo ""
          echo "Full analysis: https://www.ssllabs.com/ssltest/analyze.html?d=cyberguardng.ca"

  # Job 6: Secret Scanning (checks for leaked credentials in code)
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
